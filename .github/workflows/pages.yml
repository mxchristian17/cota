name: Deploy to GitHub Pages

# Publishes the server-less web app at https://<user>.github.io/<repo>/.
# Enable it in Settings ▸ Pages ▸ Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_CLOUD: "off"
          COTA_BASE: /${{ github.event.repository.name }}/
          # Estadísticas de visitas de la demo, opcionales: variables del repo (Settings ▸ Secrets and variables ▸
          # Actions ▸ Variables). Vacías = sin estadísticas. Ver services/web/src/analytics.ts.
          VITE_ANALYTICS_UMAMI: ${{ vars.ANALYTICS_UMAMI }}
          VITE_ANALYTICS_UMAMI_HOST: ${{ vars.ANALYTICS_UMAMI_HOST }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: services/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Sólo este job publica: el build (que corre npm ci) no recibe permisos de escritura.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
