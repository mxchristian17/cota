# Cota — self-hosted stack: web (Nginx) + API (FastAPI) + PostgreSQL.
# Usage: set POSTGRES_PASSWORD, JWT_SECRET and SECRETS_ENCRYPTION_KEY (see docs/self-hosting.md), then
#   docker compose up -d --build
# and open http://localhost:8080 (or the port in COTA_PORT).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cota
      POSTGRES_USER: cota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cota -d cota"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    # Applies the database migrations, then starts the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment:
      COTA_ENV: prod
      DATABASE_URL: postgresql+psycopg://cota:${POSTGRES_PASSWORD}@db:5432/cota
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY (a Fernet key)}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      API_CORS_ORIGINS: ${APP_BASE_URL:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./services/web
    restart: unless-stopped
    ports:
      - "${COTA_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db_data:
