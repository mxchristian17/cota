# Cota — development stack (hot reload).
# Usage: docker compose -f docker-compose.dev.yml up --build
# Web (Vite dev server) at http://localhost:5173 · API (FastAPI) at http://localhost:8000
services:
  api:
    build:
      context: ./services/api
    ports:
      - "127.0.0.1:8000:8000" # only this machine: the dev secrets are public
    volumes:
      - api_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/cota.db}
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-secret-change-me}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:5173}

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./services/web:/app
      - web_node_modules:/app/node_modules
    environment:
      # The web app calls the API same-origin under /api; Vite proxies it to the api container.
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://api:8000}
    depends_on:
      - api

volumes:
  web_node_modules:
  api_data:
