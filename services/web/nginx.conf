# Intentos de login/registro por IP (fuerza bruta y CPU de bcrypt).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabeceras de seguridad: sin iframes de otros sitios (clickjacking) ni sniffing de tipos.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback: todas las rutas resuelven a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy same-origin al backend FastAPI (evita CORS). Requiere el servicio `api`.
    # El límite acompaña a MAX_UPLOAD_BYTES (10 MB por defecto) de la API.
    location /api/ {
        client_max_body_size 12m;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
